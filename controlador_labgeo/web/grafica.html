<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braindtic - Gráfica</title>
<link rel="stylesheet" href="/style.css">
<style>svg{width:100%;height:140px;display:block}.muted{font-size:.8rem;color:#6d84a0;margin-top:4px}</style>
</head>
<body>
<div class="panel">
<header class="panel-header"><h1>Braindtic</h1><a href="/index.html" class="btn-secundario">&larr; Volver</a></header>
<p class="corrida-activa">Sesión: <select id="s"></select></p>
<p id="i" class="corrida-activa"></p>
<div id="o" style="display:grid;gap:14px"></div>
</div>
<script>
const sel=document.getElementById('s'),out=document.getElementById('o'),info=document.getElementById('i');
let ses=[];
fetch('/corridas.csv').then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
txt.split(/\r?\n/).forEach(l=>{
if(!l)return;
const m=l.match(/^---CORRIDA(\d)---$/);
if(m){ses.push({id:+m[1],p:[]});return}
if(!ses.length)return;
const v=l.split(',').map(Number);
if(v.length===3&&v.every(n=>!isNaN(n)))ses[ses.length-1].p.push(v)
});
ses=ses.filter(s=>s.p.length);
if(!ses.length){info.textContent='Todavía no hay corridas guardadas.';return}
const cont={};
ses.forEach((s,i)=>{cont[s.id]=(cont[s.id]||0)+1;sel.add(new Option(`Corrida ${s.id} · sesión ${cont[s.id]} · ${s.p.length} pt`,i))});
sel.selectedIndex=ses.length-1;
sel.onchange=()=>pintar(ses[sel.value]);
pintar(ses[sel.value])
}).catch(()=>{info.textContent='No se pudo leer /corridas.csv.'});
function fmt(ms){const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');return`${p(Math.floor(s/3600))}:${p(Math.floor(s/60%60))}:${p(s%60)}`}
function chart(p,idx,color,titulo){
const W=720,H=140,PAD=30;
const t=p.map(r=>r[2]),y=p.map(r=>r[idx]);
const t0=Math.min(...t),t1=Math.max(...t),y0=Math.min(...y),y1=Math.max(...y);
const sx=v=>PAD+(v-t0)/((t1-t0)||1)*(W-PAD-10);
const sy=v=>H-PAD-(v-y0)/((y1-y0)||1)*(H-PAD-10);
const pts=p.map(r=>`${sx(r[2]).toFixed(1)},${sy(r[idx]).toFixed(1)}`).join(' ');
const dots=p.map(r=>`<circle cx="${sx(r[2]).toFixed(1)}" cy="${sy(r[idx]).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
return`<div class="tarjeta"><b>${titulo}</b><svg viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>${dots}<text x="${PAD}" y="${H-10}" font-size="10" fill="#6d84a0">${y0}</text><text x="${W-10}" y="${H-10}" font-size="10" fill="#6d84a0" text-anchor="end">${y1}</text></svg><div class="muted">${fmt(t0)} &rarr; ${fmt(t1)}</div></div>`
}
function pintar(s){out.innerHTML=chart(s.p,0,'#2ba8e0','Dial 1 (µm)')+chart(s.p,1,'#d98c3d','Peso (mN)')}
</script>
</body>
</html>
