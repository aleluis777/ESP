<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braindtic - Gráfica</title>
<link rel="stylesheet" href="/style.css">
<style>svg{width:100%;height:140px;display:block}.muted{font-size:.8rem;color:#6d84a0;margin-top:4px}</style>
</head>
<body>
<div class="panel">
<header class="panel-header"><h1>Braindtic</h1><a href="/index.html" class="btn-secundario">&larr; Volver</a></header>
<p class="corrida-activa">Sesión: <select id="s"></select> <button id="btn-descargar" disabled>Descargar datos (Excel)</button></p>
<p id="i" class="corrida-activa"></p>
<div id="o" style="display:grid;gap:14px"></div>
</div>
<script>
const sel=document.getElementById('s'),out=document.getElementById('o'),info=document.getElementById('i');
let ses=[],diametroMm=0;
// diametroMm sale de sistema.json (seccion "equipo", ver index.html/script.js
// -- Configuracion de equipo). Se necesita para el grafico "versus" de la
// Corrida 2 (area y desplazamiento de referencia salen de el).
Promise.all([
fetch('/corridas.csv').then(r=>r.ok?r.text():Promise.reject()),
fetch('/sistema.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([txt,sistema])=>{
diametroMm=(sistema.equipo&&sistema.equipo.diametro)||0;
txt.split(/\r?\n/).forEach(l=>{
if(!l)return;
const m=l.match(/^---CORRIDA(\d)---$/);
if(m){ses.push({id:+m[1],p:[]});return}
if(!ses.length)return;
const v=l.split(',').map(Number);
if(v.length===4&&v.every(n=>!isNaN(n)))ses[ses.length-1].p.push(v)
});
ses=ses.filter(s=>s.p.length);
if(!ses.length){info.textContent='Todavía no hay corridas guardadas.';return}
const cont={};
ses.forEach((s,i)=>{cont[s.id]=(cont[s.id]||0)+1;sel.add(new Option(`Corrida ${s.id} · sesión ${cont[s.id]} · ${s.p.length} pt`,i))});
sel.selectedIndex=ses.length-1;
sel.onchange=()=>pintar(ses[sel.value]);
pintar(ses[sel.value]);
const btnDescargar=document.getElementById('btn-descargar');
btnDescargar.disabled=false;
btnDescargar.onclick=()=>descargarExcel(ses[sel.value],+sel.value)
}).catch(()=>{info.textContent='No se pudo leer /corridas.csv.'});
function fmt(ms){const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');return`${p(Math.floor(s/3600))}:${p(Math.floor(s/60%60))}:${p(s%60)}`}
function chart(p,idx,color,titulo){
const W=720,H=140,PAD=30;
const t=p.map(r=>r[3]),y=p.map(r=>r[idx]);
const t0=Math.min(...t),t1=Math.max(...t),y0=Math.min(...y),y1=Math.max(...y);
const sx=v=>PAD+(v-t0)/((t1-t0)||1)*(W-PAD-10);
const sy=v=>H-PAD-(v-y0)/((y1-y0)||1)*(H-PAD-10);
const pts=p.map(r=>`${sx(r[3]).toFixed(1)},${sy(r[idx]).toFixed(1)}`).join(' ');
const dots=p.map(r=>`<circle cx="${sx(r[3]).toFixed(1)}" cy="${sy(r[idx]).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
return`<div class="tarjeta"><b>${titulo}</b><svg viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>${dots}<text x="${PAD}" y="${H-10}" font-size="10" fill="#6d84a0">${y0}</text><text x="${W-10}" y="${H-10}" font-size="10" fill="#6d84a0" text-anchor="end">${y1}</text></svg><div class="muted">${fmt(t0)} &rarr; ${fmt(t1)}</div></div>`
}
// Grafico exclusivo de la Corrida 2: Fuerza/Area (eje Y) vs Desplazamiento en
// % (eje X). El desplazamiento sale del Dial 2 (r[1], µm -- mismo sensor que
// usa programador_corrida.c para los checkpoints de la Corrida 2). El 100%
// del eje X se define como el 16% del diametro configurado (Configuracion de
// equipo, sistema.json/"equipo"/"diametro", en mm). Area = circulo de ese
// mismo diametro. Peso viene en mN (r[2]); Fuerza/Area queda en N/mm² (MPa).
function chartVersus(p){
if(!diametroMm){
return `<div class="tarjeta"><b>Fuerza/Área vs Desplazamiento (%)</b><div class="muted">Configurá el diámetro del equipo (Configuración de equipo) para ver este gráfico.</div></div>`
}
const W=720,H=140,PAD=30,color='#d1495b';
const areaMm2=Math.PI*Math.pow(diametroMm/2,2);
const refUm=0.16*diametroMm*1000; // 16% del diametro, de mm a µm
const pts=p.map(r=>({x:(r[1]/refUm)*100,y:(r[2]/1000)/areaMm2}));
const xs=pts.map(q=>q.x),ys=pts.map(q=>q.y);
const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const sx=v=>PAD+(v-x0)/((x1-x0)||1)*(W-PAD-10);
const sy=v=>H-PAD-(v-y0)/((y1-y0)||1)*(H-PAD-10);
const linea=pts.map(q=>`${sx(q.x).toFixed(1)},${sy(q.y).toFixed(1)}`).join(' ');
const dots=pts.map(q=>`<circle cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
return`<div class="tarjeta"><b>Fuerza/Área (MPa) vs Desplazamiento (%)</b><svg viewBox="0 0 ${W} ${H}"><polyline points="${linea}" fill="none" stroke="${color}" stroke-width="1.5"/>${dots}<text x="${PAD}" y="${H-10}" font-size="10" fill="#6d84a0">${y0.toFixed(3)}</text><text x="${W-10}" y="${H-10}" font-size="10" fill="#6d84a0" text-anchor="end">${y1.toFixed(3)}</text></svg><div class="muted">${x0.toFixed(1)}% &rarr; ${x1.toFixed(1)}%</div></div>`
}
function pintar(s){
out.innerHTML=s.id===2
?chartVersus(s.p)
:chart(s.p,0,'#2ba8e0','Dial 1 (µm)')+chart(s.p,1,'#7ac943','Dial 2 (µm)')+chart(s.p,2,'#d98c3d','Peso (mN)')
}
// Descarga la sesion elegida como CSV (Excel lo abre directo con doble clic,
// sin necesidad de ninguna libreria de por medio -- asi el archivo de la web
// no crece). Para la Corrida 2 se agregan las 2 columnas calculadas del
// grafico "versus" (mismo criterio que chartVersus()), para no obligar a
// recalcularlas a mano en Excel.
function descargarExcel(s,idx){
let encabezado,filas;
if(s.id===2&&diametroMm){
const areaMm2=Math.PI*Math.pow(diametroMm/2,2);
const refUm=0.16*diametroMm*1000;
encabezado=['Dial1_um','Dial2_um','Peso_mN','Tiempo_ms','Desplazamiento_%','Fuerza_Area_MPa'];
filas=s.p.map(r=>[r[0],r[1],r[2],r[3],((r[1]/refUm)*100).toFixed(2),((r[2]/1000)/areaMm2).toFixed(4)])
}else{
encabezado=['Dial1_um','Dial2_um','Peso_mN','Tiempo_ms'];
filas=s.p.map(r=>r)
}
const lineas=[encabezado.join(','),...filas.map(f=>f.join(','))];
const csv='﻿'+lineas.join('\r\n'); // BOM adelante -- Excel necesita esto para leer bien los acentos (UTF-8)
const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=`corrida${s.id}_sesion${idx+1}.csv`;
document.body.appendChild(a);
a.click();
a.remove();
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
