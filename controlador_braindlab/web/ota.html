<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braindlab - Actualizar firmware</title>
<link rel="stylesheet" href="/style.css">
<style>
  .aviso { background: rgba(56,189,248,0.12); color: var(--acento); border: 1px solid rgba(56,189,248,0.35); border-radius: 0.75rem; padding: 0.9rem 1.1rem; margin-bottom: 1.25rem; }
  .subida { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .subida button { background: var(--acento); color: #0f172a; border: none; border-radius: 0.5rem; padding: 0.5rem 1rem; font-weight: 600; cursor: pointer; }
  .subida button:disabled { opacity: 0.6; cursor: not-allowed; }
  .subida input[type="file"] { color: var(--texto); }
  .error { color: var(--alerta); }
  .ok { color: var(--ok); }
  nav a { color: var(--texto-tenue); text-decoration: none; margin-right: 1rem; font-size: 0.9rem; }
  nav a:hover { color: var(--acento); }
</style>
</head>
<body>
  <header class="topbar-simple">
    <img class="topbar-logo" src="/logo.png" alt="BraindLab">
    <span>Actualizar firmware (OTA)</span>
  </header>

  <main>
    <nav><a href="/">Panel</a><a href="/configurar.html">Configuracion</a><a href="/files.html">Archivos</a></nav>

    <p class="aviso">
      Elegi el archivo <strong>.bin</strong> que genera <code>idf.py build</code>
      (queda en <code>build/controlador_braindlab.bin</code>). El equipo lo valida
      y, si esta bien, <strong>se reinicia solo</strong> con el firmware nuevo.
      Si el firmware nuevo no arranca bien, el equipo vuelve solo al anterior.
    </p>

    <div class="subida">
      <input type="file" id="input-firmware" accept=".bin">
      <button id="btn-subir-firmware">Actualizar firmware</button>
    </div>
    <p id="ota-mensaje"></p>
  </main>

  <script>
    // POST /ota con el .bin entero como body crudo (sin multipart, sin
    // cabecera de nombre). servidor_web.c lo escribe con esp_ota_write() en
    // la particion OTA que no esta corriendo, y si esp_ota_end() lo valida,
    // reinicia solo (mismo patron que controlador_labgeo).
    function iniciarSubidaFirmware() {
      const input = document.getElementById('input-firmware');
      const boton = document.getElementById('btn-subir-firmware');
      const mensaje = document.getElementById('ota-mensaje');

      boton.addEventListener('click', () => {
        const archivo = input.files[0];
        if (!archivo) {
          mensaje.textContent = 'Elegi un archivo .bin primero.';
          mensaje.className = 'error';
          return;
        }

        boton.disabled = true;
        mensaje.textContent = `Subiendo "${archivo.name}" (${archivo.size} bytes)...`;
        mensaje.className = '';

        fetch('/ota', { method: 'POST', body: archivo })
          .then((r) => {
            if (!r.ok) throw new Error();
            mensaje.textContent = 'Firmware aplicado -- el equipo se esta reiniciando. Esta pagina va a dejar de responder unos segundos.';
            mensaje.className = 'ok';
          })
          .catch(() => {
            mensaje.textContent = 'No se pudo aplicar el firmware (ver el log serie del equipo para el detalle).';
            mensaje.className = 'error';
            boton.disabled = false;
          });
      });
    }

    iniciarSubidaFirmware();
  </script>
</body>
</html>
